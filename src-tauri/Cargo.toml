[package]
name = "agenthub"
version = "0.16.0"
description = "Claude Code / Codex 会话状态集中监控"
authors = ["wenbo"]
edition = "2021"

[lib]
name = "agenthub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# 桌面专用（Android / iOS 不编译）
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
sha2 = "0.10"
base64 = "0.22"
aes-gcm = "0.10"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tiny_http = "0.12"
tungstenite = { version = "0.28", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
# 只读 WorkBuddy 的 sqlite（已读标记）：只要读，bundled 免装系统 sqlite
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
ab_glyph = "0.2"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_Pipes",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_UI_WindowsAndMessaging",
] }
# 读豆包窗口里已经渲染出来的对话（UI Automation，只读）
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
