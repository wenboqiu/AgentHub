<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>AgentHub · 注册</title>
<style>
  :root {
    --bg: #f5f5f7; --card: #fff; --text: #1d1d1f; --muted: #6e6e73; --line: #e5e5ea;
    --accent: #2f6fd6; --accent-soft: #e6eefb; --danger: #c4352b; --ok: #1d7a3d;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000; --card: #1c1c1e; --text: #f5f5f7; --muted: #98989d; --line: #38383a;
      --accent: #6ea2f0; --accent-soft: #17263d; --danger: #ff6b5e; --ok: #6fce8f; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
  button, input { font: inherit; color: inherit; }
  button { border: 0; border-radius: 8px; padding: 8px 14px; background: var(--line); cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; width: 100%; }
  button:disabled { opacity: .5; cursor: default; }
  input { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--card); width: 100%; }
  .card { background: var(--card); border-radius: 12px; padding: 20px; max-width: 380px; margin: 14vh auto 0; }
  h1 { font-size: 18px; margin: 0 0 14px; }
  form { display: flex; flex-direction: column; gap: 12px; }
  label { display: flex; flex-direction: column; gap: 4px; color: var(--muted); font-size: 13px; }
  .err { color: var(--danger); margin: 0; font-size: 13px; }
  .hint { color: var(--muted); font-size: 12px; margin: 12px 0 0; }
  .done { color: var(--ok); margin: 0 0 10px; font-weight: 600; }
</style>
</head>
<body>
<div class="card" id="app"></div>
<script>
'use strict'
// 只有本站接口，无第三方资源
const app = document.getElementById('app')

function h(tag, props, ...children) {
  const el = document.createElement(tag)
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v)
    else if (k === 'class') el.className = v
    else if (k in el) el[k] = v
    else el.setAttribute(k, v)
  }
  for (const c of children.flat()) if (c != null && c !== false) el.append(c instanceof Node ? c : String(c))
  return el
}

function renderForm(error) {
  const code = h('input', { placeholder: '如 AB2CD-34FGH', autocomplete: 'off', spellcheck: false, required: true, autofocus: true })
  const email = h('input', { type: 'email', placeholder: 'you@example.com', autocomplete: 'email', required: true })
  const pwd = h('input', { type: 'password', placeholder: '至少 8 位', autocomplete: 'new-password', required: true })
  const pwd2 = h('input', { type: 'password', placeholder: '再输一遍', autocomplete: 'new-password', required: true })
  const err = h('p', { class: 'err' }, error || '')
  const btn = h('button', { class: 'primary', type: 'submit' }, '注册')
  const form = h('form', {
    onsubmit: async e => {
      e.preventDefault()
      err.textContent = ''
      if (pwd.value.length < 8) return (err.textContent = '密码至少 8 位')
      if (pwd.value !== pwd2.value) return (err.textContent = '两次输入的密码不一致')
      btn.disabled = true
      btn.textContent = '注册中…'
      try {
        const res = await fetch('/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code: code.value.trim(), email: email.value.trim(), password: pwd.value }),
        })
        const json = await res.json().catch(() => ({}))
        if (!res.ok) throw new Error(json.error || '注册失败：' + res.status)
        renderDone()
      } catch (x) {
        renderForm(x.message)
      }
    },
  },
    h('label', {}, '邀请码', code),
    h('label', {}, '邮箱（作为登录账号）', email),
    h('label', {}, '密码', pwd),
    h('label', {}, '确认密码', pwd2),
    err,
    btn,
  )
  app.replaceChildren(
    h('h1', {}, 'AgentHub · 注册'),
    form,
    h('p', { class: 'hint' }, '注册后安装桌面端 / 手机客户端，登录页填本站地址和刚注册的邮箱密码即可。没有邀请码请联系管理员。'),
  )
}

function renderDone() {
  app.replaceChildren(
    h('h1', {}, 'AgentHub · 注册'),
    h('p', { class: 'done' }, '注册成功！'),
    h('p', {}, '现在安装桌面端 / 手机客户端，在登录页填本站地址和刚注册的邮箱、密码即可登录。'),
  )
}

renderForm()
</script>
</body>
</html>
